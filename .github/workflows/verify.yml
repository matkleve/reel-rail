name: verify

on:
  push:
    branches: [main]
  pull_request:

# CI runs exactly what you run locally — if the two lists drift, CI stops being trusted.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # For the e2e gate: a real browser, because jsdom has no File System Access API.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
