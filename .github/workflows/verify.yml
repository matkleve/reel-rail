name: verify

on:
  push:
    branches: [main]
  pull_request:

# CI runs exactly what you run locally — if the two lists drift, CI stops being trusted.
jobs:
  verify:
    # Pinned: Playwright 1.56 has no browser build for a newer Ubuntu (ubuntu-latest moved to 26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # For the e2e gate: a real browser, because jsdom has no File System Access API.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
